<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کارت عضویت باشگاه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="loading" class="state-screen">
    <div class="spinner"></div>
    <p class="loading-text">در حال ثبت ورود و دریافت اطلاعات...</p>
  </div>

  <div id="error-state" class="state-screen hidden">
    <div class="error-icon">⚠️</div>
    <h2 id="error-title">خطایی رخ داد</h2>
    <p id="error-message">لطفاً دوباره تلاش کنید.</p>
  </div>

  <main id="content" class="card hidden">
    <header class="card-header">
      <svg class="gym-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 4v16M18 4v16M3 9h3M3 15h3M18 9h3M18 15h3M6 12h12" stroke-linecap="round"/>
      </svg>
      <h1 class="card-title">باشگاه <span class="accent">مکس پلاس</span></h1>
    </header>

    <div id="member-name-container" class="member-name-container hidden">
      <span class="label">خوش آمدید</span>
      <span id="member-name" class="member-name">--</span>
    </div>

    <section class="sessions-block">
      <span class="label">جلسات باقی‌مانده</span>
      <span id="remaining-sessions" class="big-number">--</span>
      <span class="unit">جلسه</span>
    </section>

    <section class="expiry-block">
      <span class="label">تاریخ انقضا</span>
      <span id="expiry-date" class="expiry-date">--</span>
    </section>

    <footer class="socials">
      <a class="social-btn instagram" href="https://instagram.com/YOUR_INSTAGRAM" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.2.06 1.8.25 2.2.42.6.22 1 .48 1.4.9.4.4.68.8.9 1.4.17.4.36 1 .42 2.2.06 1.3.07 1.7.07 4.9s0 3.6-.07 4.9c-.06 1.2-.25 1.8-.42 2.2a3.8 3.8 0 0 1-.9 1.4c-.4.4-.8.68-1.4.9-.4.17-1 .36-2.2.42-1.3.06-1.7.07-4.9.07s-3.6 0-4.9-.07c-1.2-.06-1.8-.25-2.2-.42a3.8 3.8 0 0 1-1.4-.9 3.8 3.8 0 0 1-.9-1.4c-.17-.4-.36-1-.42-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.07-4.9c.06-1.2.25-1.8.42-2.2.22-.6.5-1 .9-1.4.4-.4.8-.68 1.4-.9.4-.17 1-.36 2.2-.42C8.4 2.2 8.8 2.2 12 2.2zm0 3.4a6.4 6.4 0 1 0 0 12.8 6.4 6.4 0 0 0 0-12.8zm0 10.5a4.1 4.1 0 1 1 0-8.2 4.1 4.1 0 0 1 0 8.2zm6.6-10.8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>
        <span>اینستاگرام</span>
      </a>
      <a class="social-btn telegram" href="https://t.me/YOUR_TELEGRAM" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M21.9 4.3l-3 14.2c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.3.3-.5.5-1 .5l.3-4.7L18 6.3c.4-.3-.1-.5-.6-.2L7.4 12.4l-4.5-1.4c-1-.3-1-1 .2-1.5l17.6-6.8c.8-.3 1.5.2 1.2 1.6z"/></svg>
        <span>تلگرام</span>
      </a>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
