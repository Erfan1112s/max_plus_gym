<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت حرفه‌ای باشگاه</title>
  <!-- اضافه کردن کتابخانه خواندن اکسل (SheetJS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: Tahoma, sans-serif; background: #121212; color: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .hidden { display: none !important; }
    .box { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 100%; max-width: 600px; border: 1px solid #333; margin-bottom: 20px; }
    h2 { color: #ff6a00; text-align: center; margin-bottom: 20px; }
    label { display: block; margin-top: 15px; color: #aaa; font-size: 14px; }
    input[type="text"], input[type="date"], input[type="file"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #ff6a00; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #e65c00; }
    .btn-google { background: #4285F4; }
    .btn-google:hover { background: #3367d6; }
    .btn-deduct { background: #d32f2f; padding: 8px; font-size: 12px; margin: 0; width: auto;}
    .btn-deduct:hover { background: #b71c1c; }
    
    /* جدول کاربران */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { padding: 10px; text-align: right; border-bottom: 1px solid #333; }
    th { color: #ff6a00; }
    .result { margin-top: 20px; padding: 15px; background: #0a2e0a; border: 1px solid #1b5e20; border-radius: 8px; display: none; word-break: break-all; }
    .link-box { background: #000; padding: 10px; border-radius: 5px; color: #fff; font-family: monospace; font-size: 12px; user-select: all; }
  </style>
</head>
<body>

  <!-- صفحه لاگین -->
  <div id="loginSection" class="box">
    <h2>ورود به پنل مدیریت</h2>
    <p style="text-align: center; color: #aaa; font-size: 14px;">برای امنیت، فقط ادمین‌ها با حساب گوگل وارد شوند.</p>
    <button class="btn-google" onclick="loginWithGoogle()">ورود با حساب گوگل</button>
  </div>

  <!-- داشبورد اصلی (بعد از لاگین) -->
  <div id="dashboardSection" class="hidden" style="width: 100%; max-width: 600px;">
    
    <!-- بخش آپلود اکسل -->
    <div class="box">
      <h2>آپلود گروهی (Excel)</h2>
      <p style="font-size: 12px; color: #aaa;">فایل اکسل باید دو ستون داشته باشد: <b>member_name</b> و <b>expiry_date</b> (مثلاً: 2025-12-31)</p>
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
      <button onclick="uploadExcel()">پردازش و افزودن اعضا</button>
      <div id="excelResult" style="margin-top: 15px; font-size: 13px; color: #81c784;"></div>
    </div>

    <!-- بخش ثبت تکی -->
    <div class="box">
      <h2>ثبت عضو جدید (تکی)</h2>
      <label>نام و نام خانوادگی:</label>
      <input type="text" id="memberName" placeholder="مثلاً: علی رضایی">
      <label>تاریخ انقضا:</label>
      <input type="date" id="expiryDate">
      <button onclick="registerMember()">ثبت و ساخت لینک کارت</button>
      <div class="result" id="resultBox">
        <p>✅ لینک کارت NFC (کپی کنید):</p>
        <div class="link-box" id="finalLink"></div>
      </div>
    </div>

    <!-- بخش جستجو و مدیریت -->
    <div class="box">
      <h2>مدیریت اعضا</h2>
      <label>جستجوی نام عضو:</label>
      <input type="text" id="searchName" onkeyup="searchMembers()" placeholder="تایپ کنید تا جستجو شود...">
      <div id="searchResults">
        <table id="membersTable">
          <thead>
            <tr>
              <th>نام</th>
              <th>جلسات</th>
              <th>انقضا</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <button onclick="logout()" style="background: #444; margin-bottom: 30px;">خروج از حساب</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ⚠️ اینجا را پر کنید
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // بررسی وضعیت لاگین بودن کاربر هنگام باز شدن صفحه
    async function checkAuth() {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
      }
    }
    checkAuth();

    // ورود با گوگل
    async function loginWithGoogle() {
      const { error } = await client.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
      if (error) alert(error.message);
    }

    // خروج
    async function logout() {
      await client.auth.signOut();
      window.location.reload();
    }

    // ثبت تکی (همان قبلی)
    async function registerMember() {
      const name = document.getElementById('memberName').value;
      const date = document.getElementById('expiryDate').value;
      if(!name || !date) return alert('نام و تاریخ را وارد کنید');

      const { data, error } = await client.from('members').insert([{ member_name: name, expiry_date: date }]).select();
      if (error) return alert('خطا: ' + error.message);

      const token = data[0].token;
      const link = window.location.href.replace('admin.html', '') + `?token=${token}`;
      document.getElementById('finalLink').textContent = link;
      document.getElementById('resultBox').style.display = 'block';
    }

    // 🚀 آپلود و پردازش فایل اکسل
    async function uploadExcel() {
      const fileInput = document.getElementById('excelFile');
      const file = fileInput.files[0];
      if (!file) return alert('لطفاً یک فایل انتخاب کنید');

      const resultEl = document.getElementById('excelResult');
      resultEl.textContent = 'در حال خواندن فایل...';

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          // تبدیل اکسل به JSON
          const json = XLSX.utils.sheet_to_json(firstSheet);
          
          if (json.length === 0) throw new Error('فایل خالی است');

          // آماده‌سازی داده‌ها برای درج در دیتابیس
          const membersToInsert = json.map(row => ({
            member_name: row.member_name || row['نام'],
            expiry_date: row.expiry_date || row['تاریخ انقضا']
          })).filter(m => m.member_name && m.expiry_date); // فقط ردیف‌های معتبر

          resultEl.textContent = `در حال افزودن ${membersToInsert.length} عضو...`;

          // درج دسته‌جمعی در Supabase
          const { error } = await client.from('members').insert(membersToInsert);
          if (error) throw error;

          resultEl.textContent = `✅ ${membersToInsert.length} عضو با موفقیت اضافه شدند!`;
          fileInput.value = ''; // پاک کردن فایل
          searchMembers(); // آپدیت جدول

        } catch (err) {
          resultEl.textContent = '❌ خطا در پردازش فایل: ' + err.message;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // 🚀 جستجوی زنده کاربران
    async function searchMembers() {
      const query = document.getElementById('searchName').value;
      const tbody = document.getElementById('tableBody');

      // اگر خالی بود، همه را بیاور (تا ۱۰ نفر)
      let dbQuery = client.from('members').select('*').order('created_at', { ascending: false }).limit(10);
      
      if (query) {
        dbQuery = client.from('members').select('*').ilike('member_name', `%${query}%`).limit(20);
      }

      const { data, error } = await dbQuery;
      if (error) return console.error(error);

      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">عضوی پیدا نشد</td></tr>';
        return;
      }

      data.forEach(member => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${member.member_name || 'بدون نام'}</td>
          <td>${member.remaining_sessions}</td>
          <td>${member.expiry_date}</td>
          <td><button class="btn-deduct" onclick="deductManualSession('${member.id}', ${member.remaining_sessions})">منهای ۱</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // کم کردن دستی جلسه (بدون رفرش)
    async function deductManualSession(id, currentSessions) {
      if (currentSessions <= 0) return alert('این عضو جلسه‌ای ندارد!');

      const { error } = await client.from('members').update({ remaining_sessions: currentSessions - 1 }).eq('id', id);
      if (error) return alert('خطا در ثبت');
      
      // آپدیت جدول
      searchMembers();
    }

    // لود اولیه جدول
    searchMembers();
  </script>
</body>
</html>
